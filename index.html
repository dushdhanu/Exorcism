<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yaka: Seal of the Graveyard - Prototype</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div id="game-container">
        <header>
            <h1>Yaka: The Cursed Hour</h1>
            <p>Prototype - Graveyard Shift | <span id="level-display" style="color: #66fcf1; font-weight: bold;">Level: 1</span> | <span id="coin-display" style="color: #ffd700; font-weight: bold;">Coins: 0/5</span></p>
        </header>
        
        <div id="ui-layer">
            <div id="health-bar-container">
                <div id="health-bar"></div>
            </div>
            <div id="prana-bar-container">
                <div id="prana-bar"></div>
            </div>
            <div id="transformation-dial">
                <div class="dial-option active" id="avatar-base">Base (B)</div>
                <div class="dial-option" id="avatar-sun">Sun-Flame (1)</div>
                <div class="dial-option" id="avatar-earth">Earth-Breaker (2)</div>
                <div class="dial-option" id="avatar-gale">Gale-Blade (3)</div>
                <div class="dial-option" id="avatar-mystic">Mystic (4)</div>
            </div>
        </div>

        <canvas id="gameCanvas" width="800" height="600"></canvas>
        
        <div id="instructions">
            <p><strong>Controls:</strong> WASD to move | Mouse to aim | Left Click to Attack | 1-4 to Transform</p>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
